    <style>
        /* Remove todas as margens e trava a tela para o sistema ocupar 100% do espaço */

            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f4f7f6; /* Mesma cor de fundo do seu sistema */
        }
        
        /* Estica o Iframe para esconder as bordas */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
