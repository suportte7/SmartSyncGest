<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SmartSyncGest - Gestão Inteligente de Obras</title>
    
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/2942/2942813.png" type="image/png">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            background-color: #f4f7f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            max-width: 420px;
            width: 90%;
        }
        h2 { color: #0056b3; margin-top: 0; }
        p { color: #555; font-size: 14px; line-height: 1.5; margin-bottom: 25px; }
        .btn-sistema {
            display: inline-block;
            background-color: #28a745;
            color: white;
            padding: 14px 28px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            font-size: 16px;
            box-shadow: 0 4px 10px rgba(40,167,69,0.3);
            transition: background-color 0.2s;
        }
        .btn-sistema:hover { background-color: #218838; }
        .footer-info {
            margin-top: 20px;
            font-size: 11px;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>🏗️ SmartSyncGest</h2>
        <p>Sistema de Gestão de Obras, Diários de Engenharia e Almoxarifado integrado.</p>
        
        <!-- Botão de Acesso Direto -->
        <a href="https://script.google.com/macros/s/AKfycbxgzSBjFeqh7hydEd5kZPgP-HSiY0Mm9u3yxBDMS3aukUQyGn-aMkoay5ISrbTpFds-iQ/exec" class="btn-sistema">
            🚀 Acessar Sistema
        </a>
        
        <div class="footer-info">SmartSyncGest v1.0 • Servidor Seguro Google Apps Script</div>
    </div>

    <script>
        // Redirecionamento automático opcional após 1.5 segundos (Descomente a linha abaixo se preferir que entre direto sem ver o botão)

    </script>

</body>
</html>
