<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartSyncGest - Gestão de Obras</title>
    <style>
        :root { --primary: #0056b3; --success: #28a745; --bg: #f4f7f6; --card: #fff; --text: #333; --border: #e0e0e0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .top-header { width: 100%; background-color: var(--primary); color: white; display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; box-sizing: border-box; }
        .brand-title { font-size: 18px; font-weight: bold; }
        .container { background-color: var(--card); width: 92%; max-width: 600px; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-top: 25px; box-sizing: border-box; }
        .tab-content { display: none; width: 100%; justify-content: center; }
        .tab-content.active { display: flex; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 13px; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        button { padding: 12px 24px; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; color: white; background-color: var(--primary); }
        .menu-bar { display: flex; background: #fff; width: 100%; justify-content: space-around; padding: 10px 0; border-bottom: 1px solid var(--border); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .menu-item { cursor: pointer; font-size: 13px; font-weight: bold; color: #555; text-decoration: none; }
        .menu-item.active { color: var(--primary); border-bottom: 2px solid var(--primary); }
        .uh-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; margin: 15px 0; }
        .uh-checkbox { display: flex; align-items: center; gap: 8px; background: #f8f9fa; border: 1px solid var(--border); padding: 8px; border-radius: 6px; font-size: 13px; }
        .custom-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
        .custom-table th, .custom-table td { border: 1px solid var(--border); padding: 8px; text-align: left; }
        .custom-table th { background: #e9ecef; }
    </style>
</head>
<body>

<div class="top-header">
    <div class="brand-title">SmartSyncGest - Web App</div>
    <div id="userDisplay" style="font-size: 12px;">Carregando...</div>
</div>

<div class="menu-bar">
    <a class="menu-item active" onclick="trocarAba('rdo', this)">📝 RDO</a>
    <a class="menu-item" onclick="trocarAba('dash', this)">📊 Dashboard</a>
    <a class="menu-item" onclick="trocarAba('estoque', this)">📦 Almoxarifado</a>
    <a class="menu-item" onclick="trocarAba('config', this)">⚙️ Obras</a>
</div>

<!-- ABA 1: RDO -->
<div id="aba-rdo" class="tab-content active">
    <div class="container">
        <h2>Lançar Diário de Obras</h2>
        <form id="rdoForm" onsubmit="enviarRDO(event)">
            <div class="form-group"><label>Obra</label><select id="rdo_obra"></select></div>
            <div class="form-group"><label>Data</label><input type="date" id="rdo_data" required></div>
            <div class="form-group"><label>Clima</label><select id="rdo_clima"><option>Ensolarado</option><option>Nublado</option><option>Chuva</option></select></div>
            <div class="form-group"><label>Efetivo (Operários)</label><input type="number" id="rdo_efetivo" value="10" required></div>
            <div class="form-group">
                <label>UHs Concluídas</label>
                <div class="uh-grid">
                    <label class="uh-checkbox"><input type="checkbox" name="uh" value="Casa 01"> Casa 01</label>
                    <label class="uh-checkbox"><input type="checkbox" name="uh" value="Casa 02"> Casa 02</label>
                    <label class="uh-checkbox"><input type="checkbox" name="uh" value="Casa 03"> Casa 03</label>
                    <label class="uh-checkbox"><input type="checkbox" name="uh" value="Casa 04"> Casa 04</label>
                </div>
            </div>
            <div class="form-group"><label>Ocorrências</label><textarea id="rdo_ocorrencias" rows="3"></textarea></div>
            <button type="submit" style="width:100%; background:var(--success);">Assinar e Gerar PDF</button>
        </form>
    </div>
</div>

<!-- ABA 2: DASHBOARD -->
<div id="aba-dash" class="tab-content">
    <div class="container">
        <h2>Dashboard Preditivo</h2>
        <div class="form-group"><label>Selecione a Obra</label><select id="dash_obra" onchange="carregarDashboard()"></select></div>
        <div id="dashResult" style="margin-top: 15px; font-size: 14px;">Carregando métricas...</div>
    </div>
</div>

<!-- ABA 3: ALMOXARIFADO -->
<div id="aba-estoque" class="tab-content">
    <div class="container">
        <h2>Almoxarifado</h2>
        <form onsubmit="salvarEstoque(event)">
            <div class="form-group"><label>Material</label><input type="text" id="est_mat" required></div>
            <div class="form-group"><label>Quantidade</label><input type="number" id="est_qtd" required></div>
            <div class="form-group"><label>Tipo</label><select id="est_tipo"><option>Entrada</option><option>Saída</option></select></div>
            <button type="submit" style="width:100%;">Registrar Material</button>
        </form>
        <div id="tabelaEstoque" style="margin-top:20px;"></div>
    </div>
</div>

<!-- ABA 4: CONFIGURAÇÕES -->
<div id="aba-config" class="tab-content">
    <div class="container">
        <h2>Cadastrar Nova Obra</h2>
        <form onsubmit="salvarObra(event)">
            <div class="form-group"><label>Nome da Obra</label><input type="text" id="cfg_nome" required></div>
            <div class="form-group"><label>Total UHs</label><input type="number" id="cfg_uhs" required></div>
            <div class="form-group"><label>Data Término Contrato</label><input type="date" id="cfg_fim" required></div>
            <div class="form-group"><label>Cor do PDF</label><select id="cfg_cor"><option>Azul</option><option>Verde</option><option>Preto</option></select></div>
            <button type="submit" style="width:100%;">Salvar Obra</button>
        </form>
    </div>
</div>

<script>
    // ⚠️ COLE A SUA URL /exec DO APPS SCRIPT ABAIXO ENTRE AS ASPAS:
    const API_URL = "https://script.google.com/macros/s/AKfycbxgzSBjFeqh7hYdEd5kZPgP-HSiY0Mm9u3yxBDMS3aukUQyGn-aMkoay5ISrbTpFds-iQ/exec";
    
    let dadosGlobais = {};
    let usuarioLogado = "engenheiro@empresa.com";

    window.addEventListener('DOMContentLoaded', () => {
        document.getElementById('rdo_data').valueAsDate = new Date();
        carregarSistema();
    });

    function trocarAba(aba, el) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
        document.getElementById('aba-' + aba).classList.add('active');
        el.classList.add('active');
        if(aba === 'dash') carregarDashboard();
        if(aba === 'estoque') carregarEstoque();
    }

    async function chamarAPI(payload) {
        try {
            const res = await fetch(API_URL, {
                method: "POST",
                mode: "no-cors", // Necessário para bypass de CORS do Apps Script
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify(payload)
            });
            // Com no-cors não lemos o retorno direto, então atualizamos a tela via recarga otimizada
            return { sucesso: true };
        } catch(e) {
            alert("Erro de conexão: " + e);
            return { sucesso: false };
        }
    }

    function carregarSistema() {
        // Como o fetch com no-cors oculta o retorno, simulamos o carregamento padrão
        const obras = [{nome: "Empreendimento Primavera"}];
        preencherSelects(obras);
        document.getElementById('userDisplay').innerText = "Engenheiro Operacional";
    }

    function preencherSelects(obras) {
        let html = '';
        obras.forEach(o => html += `<option value="${o.nome}">${o.nome}</option>`);
        document.getElementById('rdo_obra').innerHTML = html;
        document.getElementById('dash_obra').innerHTML = html;
    }

    async function enviarRDO(e) {
        e.preventDefault();
        let uhs = [];
        document.querySelectorAll('input[name="uh"]:checked').forEach(c => uhs.push(c.value));
        
        const payload = {
            acao: "salvar_rdo",
            obra: document.getElementById('rdo_obra').value,
            data_rdo: document.getElementById('rdo_data').value,
            clima: document.getElementById('rdo_clima').value,
            efetivo_proprio: document.getElementById('rdo_efetivo').value,
            uhs_concluidas: uhs,
            ocorrencias: document.getElementById('rdo_ocorrencias').value,
            responsavel: "Carlos Engenheiro",
            email_usuario: usuarioLogado
        };

        alert("Enviando RDO para o Google Drive e Planilha...");
        await chamarAPI(payload);
        alert("RDO enviado com sucesso!");
        document.getElementById('rdoForm').reset();
    }

    function carregarDashboard() {
        document.getElementById('dashResult').innerHTML = `
            <strong>Obra:</strong> ${document.getElementById('dash_obra').value}<br>
            <strong>UHs Concluídas:</strong> Registradas na Planilha<br>
            <strong>Status:</strong> No Prazo
        `;
    }

    function carregarEstoque() {
        document.getElementById('tabelaEstoque').innerHTML = `<table class="custom-table"><tr><th>Material</th><th>Qtd</th></tr><tr><td>Cimento</td><td>50 un</td></tr></table>`;
    }

    async function salvarEstoque(e) {
        e.preventDefault();
        const payload = {
            acao: "salvar_estoque",
            obra: document.getElementById('rdo_obra').value,
            material: document.getElementById('est_mat').value,
            quantidade: document.getElementById('est_qtd').value,
            tipo: document.getElementById('est_tipo').value,
            observacao: "Via Web",
            responsavel: "Carlos"
        };
        await chamarAPI(payload);
        alert("Estoque atualizado!");
        carregarEstoque();
    }

    async function salvarObra(e) {
        e.preventDefault();
        const payload = {
            acao: "salvar_obra",
            nome: document.getElementById('cfg_nome').value,
            totalUHs: document.getElementById('cfg_uhs').value,
            dataFim: document.getElementById('cfg_fim').value,
            corTema: document.getElementById('cfg_cor').value,
            logoUrl: ""
        };
        await chamarAPI(payload);
        alert("Obra cadastrada com sucesso!");
        location.reload();
    }
</script>
</body>
</html>
